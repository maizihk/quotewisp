name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Go ${{ matrix.go }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.8', '1.27.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzQueryParameters, FuzzUUIDPath, FuzzCategories, FuzzProblem, FuzzValidateSubmission, FuzzAdminUUIDPath]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Run fuzz target
        run: |
          case '${{ matrix.target }}' in
            FuzzValidateSubmission) pkg=./internal/web/public ;;
            FuzzAdminUUIDPath) pkg=./internal/web/admin ;;
            *) pkg=./internal/httpapi ;;
          esac
          go test "$pkg" -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s

  integration:
    name: External MariaDB 11.8 integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: integration
    env:
      MYSQL_TEST_DSN: ${{ secrets.MYSQL_TEST_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Require external database for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -n "$MYSQL_TEST_DSN"
      - name: Run integration suite
        run: go test -count=1 -race ./...

  integration-pr:
    name: Integration suite without credentials
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify explicit no-credential skip path
        env:
          MYSQL_TEST_DSN: ''
        run: go test -v -count=1 ./internal/integration

  image:
    name: Build production image
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sentence_api
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sentence-api:ci
          build-args: |
            VERSION=ci
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=ci
      - name: Verify scratch runtime policy
        run: |
          test "$(docker image inspect sentence-api:ci --format '{{.Config.User}}')" = "65532:65532"
          set +e
          docker run --rm --read-only --network none sentence-api:ci
          status=$?
          set -e
          test "$status" -eq 1
          set +e
          docker run --rm --read-only --network none sentence-api:ci web
          web_status=$?
          set -e
          test "$web_status" -eq 1
      - name: Web subcommand help
        run: docker run --rm sentence-api:ci web admin --help >/dev/null
      - name: SQLite first boot and persistence
        run: |
          volume="quotewisp-sqlite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume" >/dev/null
          cid=''
          trap 'if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null 2>&1 || true; fi; docker volume rm "$volume" >/dev/null' EXIT
          for boot in 1 2; do
            cid=$(docker run -d -p 127.0.0.1:18082:8080 -v "$volume:/var/lib/quotewisp" sentence-api:ci)
            for i in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:18082/readyz >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:18082/readyz >/dev/null
            curl --fail --silent http://127.0.0.1:18082/api/v1 >/dev/null
            curl --fail --silent http://127.0.0.1:18082/dataset/sentences.json > "$RUNNER_TEMP/sqlite-dataset-$boot.json"
            docker cp "$cid:/var/lib/quotewisp/web-secret.key" "$RUNNER_TEMP/sqlite-key-$boot" >/dev/null
            docker stop "$cid" >/dev/null
            docker rm "$cid" >/dev/null
            cid=''
          done
          cmp "$RUNNER_TEMP/sqlite-dataset-1.json" "$RUNNER_TEMP/sqlite-dataset-2.json"
          cmp "$RUNNER_TEMP/sqlite-key-1" "$RUNNER_TEMP/sqlite-key-2"
      - name: Web container smoke
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: sentence_api
          DB_USER: test
          DB_PASSWORD: test
        run: |
          data_dir="$RUNNER_TEMP/quotewisp-data"
          mkdir -p "$data_dir"
          chmod 700 "$data_dir"
          sudo chown 65532:65532 "$data_dir"
          db_args=(-e DB_HOST="$DB_HOST" -e DB_NAME="$DB_NAME" -e DB_USER="$DB_USER" -e DB_PASSWORD="$DB_PASSWORD")
          docker run --rm --network host "${db_args[@]}" sentence-api:ci migrate up
          docker run --rm --network host "${db_args[@]}" -v "$GITHUB_WORKSPACE/testdata/sentences.json:/fixtures/sentences.json:ro" sentence-api:ci import --file /fixtures/sentences.json
          printf 'ci-password-123\n' | docker run --rm -i --network host "${db_args[@]}" sentence-api:ci web admin create --username ciadmin --password-stdin
          cid=$(docker run -d --network host \
            "${db_args[@]}" \
            -e COOKIE_SECURE=false \
            -e HTTP_ADDR=127.0.0.1:8080 \
            -v "$data_dir:/var/lib/quotewisp" \
            sentence-api:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null
          docker cp "$cid:/var/lib/quotewisp/web-secret.key" "$RUNNER_TEMP/key.before"
          key_before=$(sha256sum "$RUNNER_TEMP/key.before" | cut -d' ' -f1)
          test -n "$key_before"
          docker rm -f "$cid" >/dev/null
          cid=$(docker run -d --network host "${db_args[@]}" -e COOKIE_SECURE=false -e HTTP_ADDR=127.0.0.1:8080 -v "$data_dir:/var/lib/quotewisp" sentence-api:ci)
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null
          docker cp "$cid:/var/lib/quotewisp/web-secret.key" "$RUNNER_TEMP/key.after"
          key_after=$(sha256sum "$RUNNER_TEMP/key.after" | cut -d' ' -f1)
          test "$key_before" = "$key_after"
          BASE=http://127.0.0.1:8080 bash scripts/smoke-web.sh
          BASE_URL=http://127.0.0.1:8080 bash scripts/smoke.sh

  publish:
    name: Publish protected release tag
    if: startsWith(github.ref, 'refs/tags/v') && github.ref_protected
    needs: [quality, fuzz, integration, image]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release metadata
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE: ${{ vars.IMAGE_NAME }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          test ${#COMMIT} -eq 40
          test -n "$REGISTRY"
          test -n "$IMAGE"
      - name: Set reproducible release metadata
        id: metadata
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: |
            ${{ vars.IMAGE_REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ vars.IMAGE_REGISTRY }}/${{ vars.IMAGE_NAME }}:git-${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.build_time }}
      - name: Record immutable image digest
        run: |
          echo "Image digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
