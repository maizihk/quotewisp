{{define "layout"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}}{{.TitleSuffix}}</title>
<link rel="icon" href="/favicon.ico{{if .Site.AssetRev}}?v={{.Site.AssetRev}}{{end}}">
<link rel="stylesheet" href="/static/site.css{{if .Site.AssetRev}}?v={{.Site.AssetRev}}{{end}}">
<script src="/static/theme.js{{if .Site.AssetRev}}?v={{.Site.AssetRev}}{{end}}"></script>
</head>
<body{{if eq .Page "index"}} class="home-page"{{end}}>
<header class="site-header">
<div class="site-header-inner">
<a class="site-brand" href="/">{{.Site.Name}}</a>
<div class="site-header-end">
<nav class="site-nav" aria-label="主导航">
<a href="/"{{if eq .Path "/"}} class="is-active"{{end}}>首页</a>
<a href="/docs"{{if eq .Path "/docs"}} class="is-active"{{end}}>文档</a>
<a href="/submit"{{if or (eq .Path "/submit") (eq .Path "/submit/done")}} class="is-active"{{end}}>投稿</a>
<a href="/dataset"{{if eq .Path "/dataset"}} class="is-active"{{end}}>数据</a>
</nav>
<button type="button" class="theme-toggle" data-theme-toggle aria-label="切换外观">
<svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
<svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
</button>
</div>
</div>
</header>
<main class="site-main{{if eq .Page "index"}} home-main{{end}}">
{{template "content" .}}
</main>
<footer class="site-footer">
<div class="site-footer-inner">
<p class="site-copy">© {{.Site.Name}}{{if .Site.RepoURL}} <a class="site-github" href="{{.Site.RepoURL}}" target="_blank" rel="noopener noreferrer" aria-label="源代码"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg></a>{{end}}</p>
{{if .Site.BeianText}}<p class="site-beian">{{if .Site.BeianURL}}<a href="{{.Site.BeianURL}}" target="_blank" rel="nofollow noopener noreferrer">{{.Site.BeianText}}</a>{{else}}{{.Site.BeianText}}{{end}}</p>{{end}}
</div>
</footer>
</body>
</html>
{{end}}
