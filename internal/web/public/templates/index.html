{{define "index"}}{{template "layout" .}}{{end}}
{{define "title"}}{{.Site.HomeTitle}}{{end}}
{{define "content"}}
<div class="home">
<section class="reading" aria-labelledby="random-content">
{{if .Site.Slogan}}<p class="reading-kicker">{{.Site.Slogan}}</p>{{end}}
<blockquote class="reading-quote" id="random">
<p id="random-content" data-length="short" tabindex="0" aria-live="polite" aria-atomic="true">正在寻一句话…</p>
<footer id="random-meta"></footer>
</blockquote>
<div class="reading-controls">
<button type="button" id="random-btn">换一句</button>
<button type="button" class="copy-action" id="copy-btn" disabled>复制</button>
</div>
<p class="reading-status" id="random-status" role="status" aria-live="polite"></p>
<script type="application/json" id="category-names">{{.Data.CategoryJSON}}</script>
<script src="/assets/random.js{{if .Site.AssetRev}}?v={{.Site.AssetRev}}{{end}}"></script>
<noscript>
<p class="hint">未启用 JavaScript。你仍可访问 <a href="{{.Data.APIURL}}">{{.Data.APIURL}}</a> 读取一句话。</p>
</noscript>
</section>
</div>
{{end}}
