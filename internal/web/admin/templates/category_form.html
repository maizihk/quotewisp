{{define "category_form"}}{{template "admin_layout" .}}{{end}}
{{define "title"}}新建分类{{end}}
{{define "content"}}
<div class="page-heading"><div><p class="eyebrow">内容结构</p><h1>新建分类</h1></div><div class="heading-actions"><a href="/admin/categories">返回列表</a></div></div>
{{if .Data.Flash}}<p class="flash">{{.Data.Flash}}</p>{{end}}
<form class="admin-form content-card" method="post" action="/admin/categories">
<input type="hidden" name="csrf_token" value="{{.Data.CSRF}}">
<label>代码 <input name="code" value="{{.Data.Form.Code}}" required pattern="[a-z0-9][a-z0-9_-]*"></label>
<label>名称 <input name="name" value="{{.Data.Form.Name}}" required></label>
<label>排序 <input name="sort_order" type="number" value="{{if .Data.Form.SortOrder}}{{.Data.Form.SortOrder}}{{else}}0{{end}}" required></label>
<button type="submit">创建</button>
</form>
{{end}}
