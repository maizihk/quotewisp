{{define "password"}}{{template "admin_layout" .}}{{end}}
{{define "title"}}修改密码{{end}}
{{define "content"}}
<div class="page-heading"><div><p class="eyebrow">账户安全</p><h1>修改密码</h1><p class="meta">更新当前登录账户的密码。</p></div></div>
{{if .Data.Flash}}<p class="flash">{{.Data.Flash}}</p>{{end}}
<form class="admin-form content-card" method="post" action="/admin/password">
<input type="hidden" name="csrf_token" value="{{.Data.CSRF}}">
<label>当前密码 <input name="current_password" type="password" required autocomplete="current-password"></label>
<label>新密码 <input name="password" type="password" required autocomplete="new-password"></label>
<label>确认新密码 <input name="password_confirm" type="password" required autocomplete="new-password"></label>
<button type="submit">修改</button>
</form>
{{end}}
