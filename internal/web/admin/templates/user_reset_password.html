{{define "user_reset_password"}}{{template "admin_layout" .}}{{end}}
{{define "title"}}重置管理员密码{{end}}
{{define "content"}}
<div class="page-heading"><div><p class="eyebrow">访问控制</p><h1>重置密码</h1><p class="meta">管理员 {{.Data.TargetUsername}} · ID {{.Data.TargetID}}</p></div><div class="heading-actions"><a href="/admin/users">返回管理员列表</a></div></div>
{{if .Data.Flash}}<p class="flash error">{{.Data.Flash}}</p>{{end}}
<form class="admin-form content-card" method="post" action="/admin/users/{{.Data.TargetID}}/reset-password">
<input type="hidden" name="csrf_token" value="{{.Data.CSRF}}">
<p class="meta">重置后，该账户现有登录会话将失效。</p>
<label>新密码 <input name="password" type="password" required autocomplete="new-password"></label>
<label>确认新密码 <input name="password_confirm" type="password" required autocomplete="new-password"></label>
<div class="form-actions"><button type="submit">重置密码</button></div>
</form>
{{end}}
