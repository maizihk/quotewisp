services:
  quotewisp:
    image: ${QUOTEWISP_IMAGE:-quotewisp:local}
    build: .
    container_name: quotewisp
    restart: unless-stopped
    stop_grace_period: 15s
    user: "65532:65532"
    env_file:
      - path: ./.env
        required: false
        format: raw
    ports:
      - "18080:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${SQLITE_TMPFS_SIZE:-256m},uid=65532,gid=65532,mode=0700
    volumes:
      - quotewisp-data:/var/lib/quotewisp

volumes:
  quotewisp-data:
